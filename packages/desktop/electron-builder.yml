appId: app.nuvio.desktop
productName: Nuvio
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
directories:
  output: dist-electron
files:
  - dist/**/*
  - resources/**/*
  - build/icon.ico
  - build/icon.png
  - web-dist/**/*
  # Exclude host-compiled native module artifacts from the asar.
  - "!**/node_modules/uiohook-napi/build/**"
  - "!**/node_modules/uiohook-napi/build.bak/**"
  - "!**/node_modules/uiohook-napi/bin/**"
asarUnpack:
  - "**/*.node"
  - "web-dist/animations/**"
npmRebuild: false
afterPack: ./scripts/afterPack.js
copyright: "Copyright © 2026 Nuvio"
publish:
  - provider: github
    owner: Gebelson
    repo: nuviovoice
    releaseType: release
protocols:
  - name: Nuvio
    schemes:
      - nuvio
      - nuvio-app
      - backspace
mac:
  category: public.app-category.social-networking
  minimumSystemVersion: "12.0"
  extendInfo:
    NSAudioCaptureUsageDescription: "Nuvio needs access to system audio to share sound during screen sharing."
  target:
    - dmg
win:
  icon: ./build/icon.ico
  signtoolOptions:
    publisherName: "Nuvio"
    rfc3161TimeStampServer: "http://timestamp.digicert.com"
    signingHashAlgorithms:
      - sha256
  target:
    - nsis
appx:
  identityName: ${env.APPX_IDENTITY_NAME:-app.nuvio.desktop}
  applicationId: ${env.APPX_APPLICATION_ID:-Nuvio}
  publisher: ${env.APPX_PUBLISHER:-CN=Nuvio}
  publisherDisplayName: "Nuvio"
  displayName: "Nuvio"
  backgroundColor: "#0F1117"
  showNameOnTiles: true
  languages:
    - pt-BR
    - en-US
    - es-ES
linux:
  executableName: Nuvio
  icon: build/icons/
  target:
    - AppImage
    - deb
  category: Network
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  buildUniversalInstaller: false
  artifactName: "Nuvio-Setup.${ext}"
  shortcutName: "Nuvio"
  uninstallDisplayName: "Nuvio"
  installerIcon: ./build/icon.ico
  uninstallerIcon: ./build/icon.ico
  installerHeaderIcon: ./build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true


