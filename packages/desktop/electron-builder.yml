appId: app.nuvio.desktop
productName: Nuvio
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
directories:
  output: dist-electron
files:
  - dist/**/*
  - resources/**/*
  - build/icon.ico
  - build/icon.png
  - web-dist/**/*
  # Exclude host-compiled native module artifacts from the asar.
  - "!**/node_modules/uiohook-napi/build/**"
  - "!**/node_modules/uiohook-napi/build.bak/**"
  - "!**/node_modules/uiohook-napi/bin/**"
asarUnpack:
  - "**/*.node"
  - "web-dist/animations/**"
npmRebuild: false
afterPack: ./scripts/afterPack.js
publish:
  - provider: github
    owner: Gebelson
    repo: nuviovoice
protocols:
  - name: Nuvio
    schemes:
      - nuvio
      - backspace
mac:
  category: public.app-category.social-networking
  minimumSystemVersion: "12.0"
  extendInfo:
    NSAudioCaptureUsageDescription: "Nuvio needs access to system audio to share sound during screen sharing."
  target:
    - dmg
win:
  icon: ./build/icon.ico
  target:
    - nsis
linux:
  executableName: Nuvio
  icon: build/icons/
  target:
    - AppImage
    - deb
  category: Network
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  buildUniversalInstaller: false
  artifactName: "Nuvio-Setup.${ext}"
  shortcutName: "Nuvio"
  uninstallDisplayName: "Nuvio"
  installerIcon: ./build/icon.ico
  uninstallerIcon: ./build/icon.ico
  installerHeaderIcon: ./build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true


