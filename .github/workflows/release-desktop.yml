name: Release Nuvio Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da versão para publicar (ex: v1.15.0)'
        required: false
        type: string

concurrency:
  group: release-desktop-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve Release Tag & Check Status
        id: release_meta
        shell: powershell
        run: |
          $pkgVersion = (Get-Content packages/desktop/package.json | ConvertFrom-Json).version
          $inputTag = "${{ inputs.tag }}"
          $targetTag = if ($inputTag -ne "") { $inputTag } elseif ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$pkgVersion" }
          Write-Output "Resolved target tag: $targetTag"
          Write-Output "Package version: $pkgVersion"
          "TARGET_TAG=$targetTag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_VERSION=$pkgVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Check if this release already exists with built assets on GitHub
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$targetTag" -Headers @{ "User-Agent" = "GitHubActions"; "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}" } -ErrorAction Stop
            if ($rel -and $rel.id -and $rel.assets.Count -ge 3) {
              Write-Output "Release $targetTag is already published with $($rel.assets.Count) assets on GitHub. Skipping build."
              "SKIP_BUILD=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            } else {
              Write-Output "Release $targetTag has not been completed yet. Proceeding with build."
              "SKIP_BUILD=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            }
          } catch {
            Write-Output "Release $targetTag does not exist yet. Automated build and publish will proceed for version $pkgVersion."
            "SKIP_BUILD=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Install dependencies
        if: env.SKIP_BUILD != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        if: env.SKIP_BUILD != 'true'
        run: pnpm --filter @concord/shared build

      - name: Run TypeScript checks
        if: env.SKIP_BUILD != 'true'
        run: pnpm -r typecheck

      - name: Run Desktop & Update unit tests
        if: env.SKIP_BUILD != 'true'
        run: pnpm --filter @concord/desktop test

      - name: Build shared Web frontend
        if: env.SKIP_BUILD != 'true'
        run: pnpm --filter @concord/web build

      - name: Build & Package Nuvio Desktop (Windows NSIS + Updater Metadata)
        if: env.SKIP_BUILD != 'true'
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/copy-web.js
          pnpm exec tsc
          pnpm exec electron-builder --win --x64 --publish never

      - name: Verify build artifacts and signatures
        if: env.SKIP_BUILD != 'true'
        shell: powershell
        run: |
          if (-not (Test-Path "packages/desktop/dist-electron/Nuvio-Setup.exe")) { throw "Nuvio-Setup.exe was not generated" }
          if (-not (Test-Path "packages/desktop/dist-electron/Nuvio-Setup.exe.blockmap")) { throw "Nuvio-Setup.exe.blockmap was not generated" }
          if (-not (Test-Path "packages/desktop/dist-electron/latest.yml")) { throw "latest.yml was not generated" }

          # Verify package.json version matches latest.yml version
          $pkgVersion = (Get-Content packages/desktop/package.json | ConvertFrom-Json).version
          $latestYmlContent = Get-Content packages/desktop/dist-electron/latest.yml -Raw
          if ($latestYmlContent -notmatch "version:\s*$pkgVersion") {
            throw "Version mismatch: package.json ($pkgVersion) does not match latest.yml"
          }
          Write-Output "Verified package version matches latest.yml: $pkgVersion"

          # Inspect Authenticode signature status
          $sig = Get-AuthenticodeSignature "packages/desktop/dist-electron/Nuvio-Setup.exe"
          Write-Output "=== Authenticode Signature Status ==="
          Write-Output "Status: $($sig.Status)"
          Write-Output "StatusMessage: $($sig.StatusMessage)"
          if ($sig.SignerCertificate) {
            Write-Output "Subject: $($sig.SignerCertificate.Subject)"
            Write-Output "Issuer: $($sig.SignerCertificate.Issuer)"
          } else {
            Write-Output "Note: Binary is unsigned. SmartScreen reputation will be established per-hash or through Microsoft Store / SignPath code signing."
          }

          # Generate official SHA-256 checksums file
          Get-ChildItem packages/desktop/dist-electron/Nuvio-Setup.exe, packages/desktop/dist-electron/Nuvio-Setup.exe.blockmap, packages/desktop/dist-electron/latest.yml |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Encoding ascii packages/desktop/dist-electron/SHA256SUMS.txt

          Write-Output "=== SHA256 Checksums ==="
          Get-Content packages/desktop/dist-electron/SHA256SUMS.txt

      - name: Sign with SignPath (Optional / Automated when configured)
        if: env.SKIP_BUILD != 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v1
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: "packages/desktop/dist-electron"

      - name: Publish GitHub Release
        if: env.SKIP_BUILD != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: Nuvio Desktop ${{ env.TARGET_TAG }}
          draft: false
          prerelease: false
          files: |
            packages/desktop/dist-electron/Nuvio-Setup.exe
            packages/desktop/dist-electron/Nuvio-Setup.exe.blockmap
            packages/desktop/dist-electron/latest.yml
            packages/desktop/dist-electron/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
